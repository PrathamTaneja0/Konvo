spring.application.name=konvo-backend

# MariaDB connection details - connect to external container named 'db'
spring.datasource.url=jdbc:mariadb://db:3306/konvo
# spring.datasource.url=jdbc:mariadb://localhost:3306/konvo
spring.datasource.username=root
spring.datasource.password=asdf1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Enhanced logging configuration
logging.level.org.springframework.security=INFO
logging.level.com.konvo=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n