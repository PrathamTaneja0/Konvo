version: '3.8'

services:
  # MariaDB database container
  db:
    image: mariadb:latest
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: asdf1234
      MYSQL_DATABASE: konvo
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - konvo-network
    restart: unless-stopped

  # Backend application container
  konvo-backend:
    build:
      context: ./konvo-backend
      dockerfile: Dockerfile
    container_name: konvo-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - konvo-network
    restart: unless-stopped

  # Frontend application container
  konvo-frontend:
    build:
      context: ./konvo-frontend
      dockerfile: Dockerfile
    container_name: konvo-frontend
    ports:
      - "80:80"
    depends_on:
      - konvo-backend
    networks:
      - konvo-network
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  konvo-network:
    driver: bridge
